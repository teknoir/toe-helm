---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      priorityClassName: high-priority-mqtt
      serviceAccountName: teknoir
      containers:
        - name: mqtt
          image: emqx/emqx-edge:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mqtt
          ports:
            - containerPort: 1883
            - containerPort: 18083
          resources:
            {{- toYaml $.Values.mqtt.resources | nindent 12 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
  name: toe
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        teknoir.org/app: toe
        app: toe
        control-plane: controller-manager
    spec:
      priorityClassName: high-priority-toe
      containers:
        - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
          envFrom:
            - configMapRef:
                name: toe
          volumeMounts:
            - name: toe-volume
              mountPath: /etc/teknoir
          command:
            - /manager
        image: docker.io/tekn0ir/toe:toe_v4
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: toe
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.toe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      serviceAccountName: teknoir-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: toe-volume
          hostPath:
            # directory location on host
            path: "{{ .Values.toe.configHostPath }}"